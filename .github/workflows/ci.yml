name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux and Windows
        run: |
          set -eu
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "/tmp/catsitter-$os-$arch$ext" ./cmd/catsitter
          done

  darwin:
    name: darwin build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: arm64 and amd64
        run: |
          set -eu
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/catsitter-darwin-arm64 ./cmd/catsitter
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -o /tmp/catsitter-darwin-amd64 ./cmd/catsitter
      - name: Install, update, uninstall
        run: sh packaging/test-install.sh

  scripts:
    name: install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -s sh install.sh packaging/test-install.sh
      - name: Install, update, uninstall
        run: sh packaging/test-install.sh

  scripts-windows:
    name: install.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = @(Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning)
          $issues | Format-Table -AutoSize | Out-String | Write-Output
          if ($issues.Count -gt 0) { exit 1 }
      - name: Install, update, uninstall
        shell: pwsh
        run: ./packaging/test-install.ps1

  package:
    name: goreleaser snapshot
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
